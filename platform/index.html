<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>乒乓球揮拍社群</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000; color: #e2e8f0;
    font-family: "Noto Sans TC", system-ui, sans-serif;
    overflow: hidden; height: 100vh; height: 100dvh;
  }

  /* ── Header ── */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 50px; z-index: 20;
    display: flex; align-items: center; gap: 8px; padding: 0 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,.65), transparent);
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .nav-logo { font-size: 15px; font-weight: 700; color: #00f5ff; text-decoration: none; flex: 1; letter-spacing: .04em; }
  .nav-links { display: flex; gap: 4px; }
  .nav-link { font-size: 12px; color: #e2e8f0; text-decoration: none; padding: 5px 10px; border-radius: 6px; transition: background .15s; white-space: nowrap; }
  .nav-link:hover { background: rgba(255,255,255,.15); }
  .nav-link.upload { color: #00f5ff; border: 1px solid rgba(0,245,255,.45); }

  /* ── Reels container ── */
  .reels {
    position: fixed; inset: 0;
    overflow-y: scroll; overflow-x: hidden;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    background: #000;
    scrollbar-width: none;
  }
  .reels::-webkit-scrollbar { display: none; }

  /* ── Single reel ── */
  .reel-item {
    position: relative;
    width: 100%; height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    overflow: hidden; background: #000; cursor: pointer;
  }

  .reel-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }

  /* dual gradient */
  .reel-gradient {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.55) 0%, transparent 18%),
      linear-gradient(to top,    rgba(0,0,0,.85) 0%, transparent 55%);
  }

  /* danmaku overlay */
  .dm-overlay {
    position: absolute; top: 0; left: 0; right: 0;
    bottom: 110px;
    pointer-events: none; overflow: hidden;
  }
  .dm-item {
    position: absolute; left: 100%;
    white-space: nowrap; font-size: 18px; font-weight: 600;
    text-shadow: 1px 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.7);
    line-height: 1.2; pointer-events: none;
  }

  /* info + actions row */
  .reel-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 16px 118px;
    display: flex; align-items: flex-end; gap: 14px;
  }
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    .reel-bottom { padding-bottom: calc(118px + env(safe-area-inset-bottom)); }
  }

  .reel-info { flex: 1; min-width: 0; }
  .reel-title {
    font-size: 15px; font-weight: 700; margin-bottom: 5px;
    text-shadow: 0 1px 5px rgba(0,0,0,.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .reel-meta { font-size: 12px; color: rgba(255,255,255,.6); text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  .reel-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; flex-shrink: 0; }

  .action-btn {
    width: 46px; height: 46px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.55);
    color: #fff; font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .12s, transform .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .action-btn:active { background: rgba(255,255,255,.2); transform: scale(0.92); }

  /* danmaku input bar */
  .dm-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; gap: 8px; align-items: center;
    padding: 8px 12px 16px;
    background: linear-gradient(to top, rgba(0,0,0,.65) 0%, transparent 100%);
  }
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    .dm-bar { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }
  .dm-input {
    flex: 1; padding: 9px 14px; border-radius: 22px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(0,0,0,.45);
    color: #fff; font-size: 14px; outline: none;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    -webkit-tap-highlight-color: transparent;
  }
  .dm-input::placeholder { color: rgba(255,255,255,.38); }
  .dm-input:focus { border-color: rgba(0,245,255,.5); }
  .dm-send {
    padding: 9px 16px; border-radius: 22px;
    border: 1px solid rgba(0,245,255,.45);
    background: rgba(0,245,255,.15); color: #00f5ff;
    font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .dm-send:active { background: rgba(0,245,255,.35); }

  /* tap hint */
  .tap-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; pointer-events: none;
    opacity: 0; transition: opacity .15s;
  }
  .tap-hint.show { opacity: 1; }

  /* loading / empty */
  .reel-loading, .reel-empty {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; color: #475569; font-size: 14px; text-align: center; padding: 32px;
  }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(0,245,255,.15); border-top-color: #00f5ff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <a class="nav-logo" href="../index.html">🏓 揮拍練習</a>
  <nav class="nav-links">
    <a class="nav-link" href="../index.html">← 首頁</a>
    <a class="nav-link" href="../tabletennis-forehand.html">練習</a>
    <a class="nav-link upload" href="upload.html">＋ 上傳</a>
  </nav>
</header>

<div class="reels" id="reels">
  <div class="reel-loading" id="reel-loading">
    <div class="spinner"></div>
    <div>載入中…</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const DEL_PASSWORD = '0000';
let muteState = true;

// ── Danmaku engine ───────────────────────────────────────
const LANES   = 10;
const laneEnd = new Array(LANES).fill(0);
const dmCache = new Map(); // videoId → [{time,text,color}]
const dmShown = new Map(); // videoId → Set<idx>

function getFreeLane() {
  const now = performance.now();
  let i = laneEnd.findIndex(t => t <= now);
  if (i === -1) i = Math.floor(Math.random() * LANES);
  return i;
}

function flyText(overlay, text, color) {
  const span = document.createElement('span');
  span.className   = 'dm-item';
  span.textContent = text;
  span.style.color = color || '#fff';
  overlay.appendChild(span);

  const lane  = getFreeLane();
  const laneH = overlay.offsetHeight / LANES;
  span.style.top = (lane * laneH + (laneH - 22) / 2) + 'px';

  const W   = overlay.offsetWidth;
  const dur = 7000 + Math.random() * 2000;
  laneEnd[lane] = performance.now() + dur;

  const t0 = performance.now();
  (function tick(now) {
    const p = (now - t0) / dur;
    if (p >= 1) { span.remove(); return; }
    span.style.transform = 'translateX(' + (-(W + span.offsetWidth) * p) + 'px)';
    requestAnimationFrame(tick);
  })(performance.now());
}

async function loadDanmaku(videoId) {
  if (dmCache.has(videoId)) return dmCache.get(videoId);
  try {
    const snap = await db.collection('danmaku').doc(videoId)
      .collection('comments').orderBy('time').get();
    const list = snap.docs.map(d => d.data());
    dmCache.set(videoId, list);
    return list;
  } catch(_) {
    dmCache.set(videoId, []);
    return [];
  }
}

// ── Load videos ──────────────────────────────────────────
(async () => {
  const reelsEl = document.getElementById('reels');
  try {
    const snap = await db.collection('videos')
      .orderBy('uploadedAt', 'desc').limit(60).get();

    document.getElementById('reel-loading').remove();

    if (snap.empty) {
      reelsEl.innerHTML = '<div class="reel-empty">還沒有影片<br>快去上傳第一支揮拍吧！</div>';
      return;
    }

    snap.forEach(doc => reelsEl.appendChild(makeReel(doc)));
    setupObserver();
  } catch(e) {
    document.getElementById('reel-loading').innerHTML =
      '<div style="color:#f87171;">載入失敗：' + e.message + '</div>';
  }
})();

// ── Build one reel item ──────────────────────────────────
function makeReel(doc) {
  const d    = doc.data();
  const docId = doc.id;
  const date = d.uploadedAt
    ? new Date(d.uploadedAt.toDate()).toLocaleDateString('zh-TW') : '—';

  const item = document.createElement('div');
  item.className = 'reel-item';

  // video
  const vid = document.createElement('video');
  vid.className = 'reel-video';
  vid.src       = d.url;
  vid.muted     = true;
  vid.loop      = true;
  vid.preload   = 'metadata';
  vid.setAttribute('playsinline', '');

  // gradients
  const grad = document.createElement('div');
  grad.className = 'reel-gradient';

  // danmaku overlay
  const dmOv = document.createElement('div');
  dmOv.className = 'dm-overlay';

  // tap hint
  const hint = document.createElement('div');
  hint.className = 'tap-hint';
  hint.textContent = '⏸';

  // info + action row
  const bottom = document.createElement('div');
  bottom.className = 'reel-bottom';

  const info = document.createElement('div');
  info.className = 'reel-info';
  info.innerHTML =
    '<div class="reel-title">' + escHtml(d.title || '揮拍練習') + '</div>' +
    '<div class="reel-meta">'  + date + '</div>';

  const actions = document.createElement('div');
  actions.className = 'reel-actions';

  const muteBtn = document.createElement('button');
  muteBtn.className = 'action-btn mute-btn';
  muteBtn.title = '靜音切換';
  muteBtn.textContent = '🔇';
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    muteState = !muteState;
    vid.muted = muteState;
    syncMuteBtns();
  });

  const delBtn = document.createElement('button');
  delBtn.className = 'action-btn';
  delBtn.title = '刪除影片';
  delBtn.textContent = '🗑';
  delBtn.addEventListener('click', async e => {
    e.stopPropagation();
    const pwd = prompt('請輸入刪除密碼：');
    if (pwd === null) return;
    if (pwd !== DEL_PASSWORD) { alert('密碼錯誤'); return; }
    if (!confirm('確定刪除？（無法復原）')) return;
    try {
      await db.collection('videos').doc(docId).delete();
      item.remove();
    } catch(err) {
      alert('刪除失敗：' + err.message);
    }
  });

  actions.appendChild(muteBtn);
  actions.appendChild(delBtn);
  bottom.appendChild(info);
  bottom.appendChild(actions);

  // danmaku input bar
  const dmBar = document.createElement('div');
  dmBar.className = 'dm-bar';

  const dmInput = document.createElement('input');
  dmInput.className   = 'dm-input';
  dmInput.type        = 'text';
  dmInput.placeholder = '發送彈幕…';
  dmInput.maxLength   = 50;

  const dmSend = document.createElement('button');
  dmSend.className   = 'dm-send';
  dmSend.textContent = '發送';

  dmBar.appendChild(dmInput);
  dmBar.appendChild(dmSend);

  // tap to play/pause
  item.addEventListener('click', e => {
    if (e.target.closest('.action-btn, .dm-bar')) return;
    if (vid.paused) { vid.play(); hint.textContent = '▶'; }
    else            { vid.pause(); hint.textContent = '⏸'; }
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 700);
  });

  item.appendChild(vid);
  item.appendChild(grad);
  item.appendChild(dmOv);
  item.appendChild(hint);
  item.appendChild(bottom);
  item.appendChild(dmBar);

  // danmaku: send
  async function sendDm() {
    const text = dmInput.value.trim();
    if (!text) return;
    const time  = vid.currentTime;
    const color = '#ffffff';
    try {
      await db.collection('danmaku').doc(docId)
        .collection('comments').add({
          text, color, time,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      dmInput.value = '';
      flyText(dmOv, text, color);
      const list = dmCache.get(docId) || [];
      list.push({ text, color, time });
      list.sort((a, b) => a.time - b.time);
      dmCache.set(docId, list);
    } catch(_) {}
  }

  dmSend.addEventListener('click',   e => { e.stopPropagation(); sendDm(); });
  dmInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.stopPropagation(); sendDm(); } });
  dmInput.addEventListener('click',   e => e.stopPropagation());

  // danmaku: replay on timeupdate
  dmShown.set(docId, new Set());
  vid.addEventListener('timeupdate', () => {
    const list = dmCache.get(docId);
    if (!list) return;
    const shown = dmShown.get(docId);
    const t = vid.currentTime;
    list.forEach((d, i) => {
      if (!shown.has(i) && d.time <= t && t - d.time < 0.5) {
        shown.add(i); flyText(dmOv, d.text, d.color);
      }
    });
  });
  vid.addEventListener('seeked', () => dmShown.set(docId, new Set()));

  // expose load function for observer
  item._loadDm = () => loadDanmaku(docId);

  return item;
}

// ── IntersectionObserver ─────────────────────────────────
function setupObserver() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const vid = entry.target.querySelector('.reel-video');
      if (!vid) return;

      if (entry.intersectionRatio >= 0.75) {
        vid.muted = muteState;
        vid.play().catch(() => {
          vid.muted = true; muteState = true;
          syncMuteBtns(); vid.play().catch(() => {});
        });
        // load danmaku on first view
        if (entry.target._loadDm) {
          entry.target._loadDm();
          entry.target._loadDm = null;
        }
      } else if (entry.intersectionRatio < 0.25) {
        vid.pause(); vid.currentTime = 0;
      }
    });
  }, { threshold: [0.25, 0.75] });

  document.querySelectorAll('.reel-item').forEach(item => obs.observe(item));
}

function syncMuteBtns() {
  document.querySelectorAll('.mute-btn').forEach(b => { b.textContent = muteState ? '🔇' : '🔊'; });
  document.querySelectorAll('.reel-video').forEach(v => { if (!v.paused) v.muted = muteState; });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
