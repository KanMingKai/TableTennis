<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>乒乓球揮拍社群</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000; color: #e2e8f0;
    font-family: "Noto Sans TC", system-ui, sans-serif;
    overflow: hidden; height: 100vh; height: 100dvh;
  }

  /* ── Header (overlays reels) ── */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 50px; z-index: 20;
    display: flex; align-items: center; gap: 8px; padding: 0 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,.65) 0%, transparent 100%);
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .nav-logo { font-size: 15px; font-weight: 700; color: #00f5ff; text-decoration: none; flex: 1; letter-spacing: .04em; }
  .nav-links { display: flex; gap: 4px; }
  .nav-link { font-size: 12px; color: #e2e8f0; text-decoration: none; padding: 5px 10px; border-radius: 6px; transition: background .15s; white-space: nowrap; }
  .nav-link:hover { background: rgba(255,255,255,.15); }
  .nav-link.upload { color: #00f5ff; border: 1px solid rgba(0,245,255,.45); }
  .nav-link.upload:hover { background: rgba(0,245,255,.1); }

  /* ── Reels container ── */
  .reels {
    position: fixed; inset: 0;
    overflow-y: scroll; overflow-x: hidden;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    background: #000;
    scrollbar-width: none;
  }
  .reels::-webkit-scrollbar { display: none; }

  /* ── Single reel item ── */
  .reel-item {
    position: relative;
    width: 100%; height: 100vh; height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden; background: #000;
    cursor: pointer;
  }

  .reel-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }

  /* dual gradient: top for header, bottom for info */
  .reel-gradient {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.55) 0%, transparent 18%),
      linear-gradient(to top,    rgba(0,0,0,.8)  0%, transparent 50%);
  }

  /* bottom info + actions */
  .reel-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 16px 40px;
    display: flex; align-items: flex-end; gap: 14px;
  }
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    .reel-bottom { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  }

  .reel-info { flex: 1; min-width: 0; }
  .reel-title {
    font-size: 15px; font-weight: 700; margin-bottom: 5px;
    text-shadow: 0 1px 5px rgba(0,0,0,.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .reel-meta { font-size: 12px; color: rgba(255,255,255,.6); text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  .reel-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; flex-shrink: 0; }

  .action-btn {
    width: 46px; height: 46px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.55);
    color: #fff; font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    transition: background .12s, transform .12s;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
  }
  .action-btn:active { background: rgba(255,255,255,.2); transform: scale(0.92); }

  /* tap play/pause ripple */
  .tap-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; pointer-events: none;
    opacity: 0; transition: opacity .15s;
  }
  .tap-hint.show { opacity: 1; }

  /* ── Loading / empty ── */
  .reel-loading, .reel-empty {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; color: #475569; font-size: 14px; text-align: center; padding: 32px;
  }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(0,245,255,.15); border-top-color: #00f5ff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <a class="nav-logo" href="../index.html">🏓 揮拍練習</a>
  <nav class="nav-links">
    <a class="nav-link" href="../index.html">← 首頁</a>
    <a class="nav-link" href="../tabletennis-forehand.html">練習</a>
    <a class="nav-link upload" href="upload.html">＋ 上傳</a>
  </nav>
</header>

<div class="reels" id="reels">
  <div class="reel-loading" id="reel-loading">
    <div class="spinner"></div>
    <div>載入中…</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const DEL_PASSWORD = '0000';
let muteState = true;

// ── Load videos ─────────────────────────────────────────
(async () => {
  const reelsEl = document.getElementById('reels');
  try {
    const snap = await db.collection('videos')
      .orderBy('uploadedAt', 'desc').limit(60).get();

    document.getElementById('reel-loading').remove();

    if (snap.empty) {
      reelsEl.innerHTML = '<div class="reel-empty">還沒有影片<br>快去上傳第一支揮拍吧！</div>';
      return;
    }

    snap.forEach(doc => reelsEl.appendChild(makeReel(doc)));
    setupObserver();
  } catch(e) {
    document.getElementById('reel-loading').innerHTML =
      '<div style="color:#f87171;">載入失敗：' + e.message + '</div>';
  }
})();

// ── Build one reel item ─────────────────────────────────
function makeReel(doc) {
  const d    = doc.data();
  const date = d.uploadedAt
    ? new Date(d.uploadedAt.toDate()).toLocaleDateString('zh-TW') : '—';

  const item = document.createElement('div');
  item.className = 'reel-item';

  // video
  const vid = document.createElement('video');
  vid.className   = 'reel-video';
  vid.src         = d.url;
  vid.muted       = true;
  vid.loop        = true;
  vid.preload     = 'metadata';
  vid.setAttribute('playsinline', '');

  // gradients overlay
  const grad = document.createElement('div');
  grad.className = 'reel-gradient';

  // tap hint (play/pause visual)
  const hint = document.createElement('div');
  hint.className = 'tap-hint';
  hint.textContent = '⏸';

  // bottom bar
  const bottom = document.createElement('div');
  bottom.className = 'reel-bottom';

  const info = document.createElement('div');
  info.className = 'reel-info';
  info.innerHTML =
    '<div class="reel-title">' + escHtml(d.title) + '</div>' +
    '<div class="reel-meta">'  + date + '</div>';

  const actions = document.createElement('div');
  actions.className = 'reel-actions';

  // mute btn
  const muteBtn = document.createElement('button');
  muteBtn.className = 'action-btn mute-btn';
  muteBtn.title = '靜音切換';
  muteBtn.textContent = '🔇';
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    muteState = !muteState;
    vid.muted = muteState;
    syncMuteBtns();
  });

  // comment / danmaku link
  const cmtBtn = document.createElement('a');
  cmtBtn.className = 'action-btn';
  cmtBtn.href = 'video.html?id=' + doc.id;
  cmtBtn.title = '彈幕留言';
  cmtBtn.textContent = '💬';
  cmtBtn.addEventListener('click', e => e.stopPropagation());

  // delete btn
  const delBtn = document.createElement('button');
  delBtn.className = 'action-btn';
  delBtn.title = '刪除影片';
  delBtn.textContent = '🗑';
  delBtn.addEventListener('click', async e => {
    e.stopPropagation();
    const pwd = prompt('請輸入刪除密碼：');
    if (pwd === null) return;
    if (pwd !== DEL_PASSWORD) { alert('密碼錯誤'); return; }
    if (!confirm('確定刪除「' + d.title + '」？\n（無法復原）')) return;
    try {
      await db.collection('videos').doc(doc.id).delete();
      item.remove();
    } catch(err) {
      alert('刪除失敗：' + err.message);
    }
  });

  actions.appendChild(muteBtn);
  actions.appendChild(cmtBtn);
  actions.appendChild(delBtn);
  bottom.appendChild(info);
  bottom.appendChild(actions);

  // tap video → play / pause
  item.addEventListener('click', e => {
    if (e.target.closest('.action-btn, a')) return;
    if (vid.paused) {
      vid.play();
      hint.textContent = '▶';
    } else {
      vid.pause();
      hint.textContent = '⏸';
    }
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 700);
  });

  item.appendChild(vid);
  item.appendChild(grad);
  item.appendChild(hint);
  item.appendChild(bottom);
  return item;
}

// ── IntersectionObserver: auto play / pause ─────────────
function setupObserver() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const vid = entry.target.querySelector('.reel-video');
      if (!vid) return;

      if (entry.intersectionRatio >= 0.75) {
        vid.muted = muteState;
        vid.play().catch(() => {
          // Browser blocked unmuted autoplay → fall back to muted
          vid.muted = true;
          muteState = true;
          syncMuteBtns();
          vid.play().catch(() => {});
        });
      } else if (entry.intersectionRatio < 0.25) {
        vid.pause();
        vid.currentTime = 0;
      }
    });
  }, { threshold: [0.25, 0.75] });

  document.querySelectorAll('.reel-item').forEach(item => obs.observe(item));
}

function syncMuteBtns() {
  document.querySelectorAll('.mute-btn').forEach(b => {
    b.textContent = muteState ? '🔇' : '🔊';
  });
  document.querySelectorAll('.reel-video').forEach(v => {
    if (!v.paused) v.muted = muteState;
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
