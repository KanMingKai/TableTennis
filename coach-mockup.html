<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教練標注工具 Mockup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cyan: #00f5ff; --bg: #0a0a0f; --card: #111827;
    --border: rgba(0,245,255,.12); --gray: #64748b; --text: #e2e8f0;
  }
  body { background: var(--bg); color: var(--text); font-family: "Noto Sans TC", system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 50px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,.75); backdrop-filter: blur(8px); flex-shrink: 0; }
  .nav-logo { font-size: 15px; font-weight: 700; color: var(--cyan); flex: 1; }
  .badge { font-size: 11px; background: rgba(0,245,255,.15); color: var(--cyan); border: 1px solid rgba(0,245,255,.3); padding: 3px 8px; border-radius: 20px; }

  .layout { display: flex; flex-direction: column; flex: 1; max-width: 520px; width: 100%; margin: 0 auto; }

  /* ── Video + Canvas ── */
  .video-wrap {
    position: relative; width: 100%; background: #000;
    aspect-ratio: 16/9;
  }
  .video-wrap video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #anno-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    cursor: crosshair; touch-action: none;
  }

  /* annotation dot on timeline */
  .anno-dot {
    position: absolute; top: -5px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--cyan); border: 2px solid #fff;
    transform: translateX(-50%); cursor: pointer;
    transition: transform .1s;
  }
  .anno-dot:hover { transform: translateX(-50%) scale(1.4); }
  .anno-dot.selected { background: #f59e0b; }

  /* ── Controls ── */
  .controls { padding: 10px 12px 6px; border-bottom: 1px solid var(--border); background: #0d1117; }

  /* playback */
  .playback-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .play-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--cyan); color: #000; font-size: 14px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .time-display { font-size: 12px; color: var(--gray); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .seek-wrap { flex: 1; position: relative; height: 28px; display: flex; align-items: center; }
  .seek-track { width: 100%; height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; position: relative; cursor: pointer; }
  .seek-fill { height: 100%; background: var(--cyan); border-radius: 2px; width: 35%; pointer-events: none; }
  .seek-thumb { position: absolute; top: 50%; left: 35%; transform: translate(-50%,-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--cyan); border: 2px solid #fff; pointer-events: none; }

  /* tool row */
  .tool-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tool-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 10px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05);
    color: #94a3b8; font-size: 12px; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .tool-btn.active { border-color: var(--cyan); background: rgba(0,245,255,.12); color: var(--cyan); }
  .tool-btn:hover { border-color: rgba(255,255,255,.25); color: var(--text); }
  .tool-icon { font-size: 14px; }

  .color-row { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .color-dot {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform .1s;
  }
  .color-dot.active { border-color: #fff; transform: scale(1.2); }
  .color-dot:hover { transform: scale(1.15); }

  .size-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .size-label { font-size: 11px; color: var(--gray); }
  input[type=range] { flex: 1; accent-color: var(--cyan); height: 4px; }
  .btn-clear { margin-left: auto; font-size: 11px; color: #ef4444; background: none; border: 1px solid rgba(239,68,68,.3); padding: 3px 8px; border-radius: 5px; cursor: pointer; }
  .btn-clear:hover { background: rgba(239,68,68,.1); }

  /* ── Add annotation button ── */
  .add-anno-btn {
    width: calc(100% - 24px); margin: 10px 12px 0;
    padding: 10px; border-radius: 8px;
    border: 1px dashed rgba(0,245,255,.35);
    background: rgba(0,245,255,.05);
    color: var(--cyan); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .add-anno-btn:hover { background: rgba(0,245,255,.1); border-color: rgba(0,245,255,.6); }

  /* ── Annotation list ── */
  .anno-section { flex: 1; overflow-y: auto; padding: 0 12px 80px; }
  .anno-section-title { font-size: 12px; color: var(--gray); padding: 12px 0 8px; letter-spacing: .05em; text-transform: uppercase; }

  .anno-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    cursor: pointer; transition: border-color .15s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .anno-card:hover, .anno-card.selected { border-color: rgba(0,245,255,.4); }
  .anno-card.selected { background: #151f30; }
  .anno-top { display: flex; align-items: center; gap: 8px; }
  .anno-time { font-size: 11px; font-weight: 700; color: var(--cyan); background: rgba(0,245,255,.12); padding: 2px 7px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .anno-tool-tag { font-size: 10px; color: var(--gray); background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 4px; }
  .anno-color-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-left: auto; }
  .anno-text { font-size: 13px; line-height: 1.5; color: var(--text); }
  .anno-text textarea {
    width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(0,245,255,.2);
    border-radius: 6px; color: var(--text); font-size: 13px; padding: 6px 8px;
    resize: none; outline: none; font-family: inherit;
  }
  .anno-text textarea:focus { border-color: rgba(0,245,255,.5); }
  .anno-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }
  .btn-xs { font-size: 11px; padding: 3px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,.12); background: none; color: #94a3b8; cursor: pointer; }
  .btn-xs.danger { color: #ef4444; border-color: rgba(239,68,68,.25); }
  .btn-xs.primary { color: var(--cyan); border-color: rgba(0,245,255,.3); }

  /* ── Save bar ── */
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px; background: rgba(10,10,15,.9); backdrop-filter: blur(8px); border-top: 1px solid var(--border); display: flex; gap: 10px; max-width: 520px; margin: 0 auto; }
  .btn-save { flex: 1; padding: 11px; border-radius: 9px; border: none; background: var(--cyan); color: #000; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-send { flex: 1; padding: 11px; border-radius: 9px; border: 1px solid rgba(0,245,255,.3); background: transparent; color: var(--cyan); font-size: 14px; font-weight: 600; cursor: pointer; }

  /* ── Toast ── */
  .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-10px); background: #1e293b; border: 1px solid rgba(0,245,255,.3); color: var(--text); font-size: 13px; padding: 8px 16px; border-radius: 8px; opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* demo video placeholder */
  .video-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, #0d1b2a 0%, #1a2744 100%); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: #475569; font-size: 13px; }
  .video-placeholder .big { font-size: 40px; }
</style>
</head>
<body>

<header>
  <span class="nav-logo">🏓 教練平台</span>
  <span class="badge">教練模式</span>
</header>

<div class="layout">

  <!-- Video + Canvas -->
  <div class="video-wrap" id="video-wrap">
    <div class="video-placeholder">
      <div class="big">🎥</div>
      <div>學生影片（示意）</div>
      <div style="font-size:11px;color:#334155;">點擊畫面可在此時間點加標注</div>
    </div>
    <canvas id="anno-canvas"></canvas>
  </div>

  <!-- Controls -->
  <div class="controls">
    <!-- Playback -->
    <div class="playback-row">
      <button class="play-btn" id="play-btn">▶</button>
      <span class="time-display" id="time-display">0:02 / 0:08</span>
      <div class="seek-wrap">
        <div class="seek-track" id="seek-track">
          <div class="seek-fill" id="seek-fill"></div>
          <div class="seek-thumb" id="seek-thumb"></div>
          <!-- annotation dots -->
          <div class="anno-dot" style="left:25%" data-idx="0" title="0:02 手肘位置"></div>
          <div class="anno-dot selected" style="left:35%" data-idx="1" title="0:02.8 揮臂軌跡"></div>
          <div class="anno-dot" style="left:62%" data-idx="2" title="0:05 重心轉移"></div>
        </div>
      </div>
    </div>

    <!-- Tools -->
    <div class="tool-row">
      <button class="tool-btn" id="tool-arrow" onclick="setTool('arrow',this)">
        <span class="tool-icon">↗</span> 箭頭
      </button>
      <button class="tool-btn active" id="tool-circle" onclick="setTool('circle',this)">
        <span class="tool-icon">⭕</span> 圈選
      </button>
      <button class="tool-btn" id="tool-pen" onclick="setTool('pen',this)">
        <span class="tool-icon">✏️</span> 自由畫
      </button>
      <button class="tool-btn" id="tool-text" onclick="setTool('text',this)">
        <span class="tool-icon">T</span> 文字
      </button>
      <div class="color-row">
        <div class="color-dot active" style="background:#00f5ff" onclick="setColor('#00f5ff',this)"></div>
        <div class="color-dot" style="background:#f59e0b" onclick="setColor('#f59e0b',this)"></div>
        <div class="color-dot" style="background:#ef4444" onclick="setColor('#ef4444',this)"></div>
        <div class="color-dot" style="background:#a3e635" onclick="setColor('#a3e635',this)"></div>
      </div>
    </div>

    <div class="size-row">
      <span class="size-label">筆刷粗細</span>
      <input type="range" min="1" max="8" value="3" id="brush-size">
      <button class="btn-clear" onclick="clearCanvas()">清除畫面</button>
    </div>
  </div>

  <!-- Add annotation -->
  <button class="add-anno-btn" onclick="addAnnoAtCurrentTime()">
    ＋ 在此時間點加文字說明
  </button>

  <!-- Annotation list -->
  <div class="anno-section">
    <div class="anno-section-title">標注記錄（3）</div>

    <div class="anno-card" onclick="selectAnno(this,0)">
      <div class="anno-top">
        <span class="anno-time">0:02.0</span>
        <span class="anno-tool-tag">⭕ 圈選</span>
        <div class="anno-color-swatch" style="background:#ef4444"></div>
      </div>
      <div class="anno-text">手肘抬起的角度不夠，揮拍時手肘應與肩膀齊平。</div>
      <div class="anno-actions">
        <button class="btn-xs" onclick="event.stopPropagation();editAnno(this)">編輯</button>
        <button class="btn-xs danger" onclick="event.stopPropagation();deleteAnno(this)">刪除</button>
      </div>
    </div>

    <div class="anno-card selected" onclick="selectAnno(this,1)">
      <div class="anno-top">
        <span class="anno-time">0:02.8</span>
        <span class="anno-tool-tag">↗ 箭頭</span>
        <div class="anno-color-swatch" style="background:#00f5ff"></div>
      </div>
      <div class="anno-text" id="editing-text">
        <textarea rows="2" onclick="event.stopPropagation()">揮臂軌跡往右偏，應沿虛線方向往前推出。</textarea>
      </div>
      <div class="anno-actions">
        <button class="btn-xs primary" onclick="event.stopPropagation();saveEdit(this)">儲存</button>
        <button class="btn-xs danger" onclick="event.stopPropagation();deleteAnno(this)">刪除</button>
      </div>
    </div>

    <div class="anno-card" onclick="selectAnno(this,2)">
      <div class="anno-top">
        <span class="anno-time">0:05.0</span>
        <span class="anno-tool-tag">✏️ 自由畫</span>
        <div class="anno-color-swatch" style="background:#f59e0b"></div>
      </div>
      <div class="anno-text">重心轉移太晚，擊球前膝蓋要先彎曲準備好。</div>
      <div class="anno-actions">
        <button class="btn-xs" onclick="event.stopPropagation();editAnno(this)">編輯</button>
        <button class="btn-xs danger" onclick="event.stopPropagation();deleteAnno(this)">刪除</button>
      </div>
    </div>
  </div>

</div>

<!-- Save bar -->
<div class="save-bar">
  <button class="btn-save" onclick="showToast('草稿已儲存 ✓')">儲存草稿</button>
  <button class="btn-send" onclick="showToast('已發送給學生 ✉️')">發送給學生</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── Canvas drawing ──────────────────────────────────────
const canvas = document.getElementById('anno-canvas');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('video-wrap');

let activeTool  = 'circle';
let activeColor = '#00f5ff';
let brushSize   = 3;
let drawing     = false;
let startX, startY, lastX, lastY;
let snapshot;

function resizeCanvas() {
  canvas.width  = wrap.offsetWidth;
  canvas.height = wrap.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// demo: draw existing annotations on load
setTimeout(() => {
  drawDemoAnnotations();
}, 100);

function drawDemoAnnotations() {
  const w = canvas.width, h = canvas.height;

  // circle annotation (red)
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth   = 3;
  ctx.beginPath();
  ctx.ellipse(w * 0.3, h * 0.35, 40, 30, 0, 0, Math.PI * 2);
  ctx.stroke();

  // arrow annotation (cyan)
  ctx.strokeStyle = '#00f5ff';
  ctx.lineWidth   = 3;
  drawArrow(ctx, w*0.55, h*0.5, w*0.72, h*0.35);

  // freehand curve (amber) - simplified as curved path
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth   = 3;
  ctx.beginPath();
  ctx.moveTo(w*0.2, h*0.7);
  ctx.bezierCurveTo(w*0.3, h*0.6, w*0.45, h*0.65, w*0.5, h*0.55);
  ctx.stroke();
}

function drawArrow(ctx, x1, y1, x2, y2) {
  const headLen = 12;
  const angle   = Math.atan2(y2-y1, x2-x1);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x2 - headLen*Math.cos(angle-Math.PI/6), y2 - headLen*Math.sin(angle-Math.PI/6));
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen*Math.cos(angle+Math.PI/6), y2 - headLen*Math.sin(angle+Math.PI/6));
  ctx.stroke();
}

function getPos(e) {
  const r  = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  return [cx * (canvas.width/r.width), cy * (canvas.height/r.height)];
}

canvas.addEventListener('pointerdown', e => {
  if (activeTool === 'text') { addTextAtPos(...getPos(e)); return; }
  drawing  = true;
  [startX, startY] = getPos(e);
  [lastX,  lastY]  = [startX, startY];
  snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!drawing) return;
  const [cx, cy] = getPos(e);
  ctx.strokeStyle = activeColor;
  ctx.lineWidth   = brushSize;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  if (activeTool === 'pen') {
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(cx, cy); ctx.stroke();
    [lastX, lastY] = [cx, cy];
  } else {
    ctx.putImageData(snapshot, 0, 0);
    if (activeTool === 'arrow') {
      drawArrow(ctx, startX, startY, cx, cy);
    } else if (activeTool === 'circle') {
      ctx.beginPath();
      ctx.ellipse((startX+cx)/2, (startY+cy)/2, Math.abs(cx-startX)/2, Math.abs(cy-startY)/2, 0, 0, Math.PI*2);
      ctx.stroke();
    }
  }
});

canvas.addEventListener('pointerup', () => { drawing = false; });

function addTextAtPos(x, y) {
  const t = prompt('輸入標注文字：');
  if (!t) return;
  ctx.fillStyle = activeColor;
  ctx.font      = `bold ${12 + brushSize * 2}px "Noto Sans TC", system-ui`;
  ctx.fillText(t, x, y);
}

// ── UI helpers ─────────────────────────────────────────
function setTool(name, el) {
  activeTool = name;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function setColor(c, el) {
  activeColor = c;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
}

document.getElementById('brush-size').addEventListener('input', e => {
  brushSize = +e.target.value;
});

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  showToast('畫面已清除');
}

let annoCount = 3;
function addAnnoAtCurrentTime() {
  annoCount++;
  const section = document.querySelector('.anno-section');
  const title   = section.querySelector('.anno-section-title');
  title.textContent = `標注記錄（${annoCount}）`;
  const card = document.createElement('div');
  card.className = 'anno-card selected';
  card.innerHTML = `
    <div class="anno-top">
      <span class="anno-time">0:02.${Math.floor(Math.random()*9)}</span>
      <span class="anno-tool-tag">${activeTool === 'arrow' ? '↗ 箭頭' : activeTool === 'circle' ? '⭕ 圈選' : activeTool === 'pen' ? '✏️ 自由畫' : 'T 文字'}</span>
      <div class="anno-color-swatch" style="background:${activeColor}"></div>
    </div>
    <div class="anno-text"><textarea rows="2" placeholder="輸入說明…"></textarea></div>
    <div class="anno-actions">
      <button class="btn-xs primary" onclick="event.stopPropagation();saveEdit(this)">儲存</button>
      <button class="btn-xs danger" onclick="event.stopPropagation();deleteAnno(this)">刪除</button>
    </div>`;
  section.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.querySelector('textarea').focus();
}

function selectAnno(card, idx) {
  document.querySelectorAll('.anno-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  document.querySelectorAll('.anno-dot').forEach(d => d.classList.remove('selected'));
  const dot = document.querySelector(`.anno-dot[data-idx="${idx}"]`);
  if (dot) dot.classList.add('selected');
}

function editAnno(btn) {
  const card   = btn.closest('.anno-card');
  const textEl = card.querySelector('.anno-text');
  const cur    = textEl.textContent.trim();
  textEl.innerHTML = `<textarea rows="2">${cur}</textarea>`;
  const actions = card.querySelector('.anno-actions');
  actions.innerHTML = `
    <button class="btn-xs primary" onclick="event.stopPropagation();saveEdit(this)">儲存</button>
    <button class="btn-xs danger" onclick="event.stopPropagation();deleteAnno(this)">刪除</button>`;
  textEl.querySelector('textarea').focus();
}

function saveEdit(btn) {
  const card   = btn.closest('.anno-card');
  const ta     = card.querySelector('textarea');
  const val    = ta ? ta.value.trim() : '';
  if (!val) return;
  card.querySelector('.anno-text').innerHTML = val;
  const actions = card.querySelector('.anno-actions');
  actions.innerHTML = `
    <button class="btn-xs" onclick="event.stopPropagation();editAnno(this)">編輯</button>
    <button class="btn-xs danger" onclick="event.stopPropagation();deleteAnno(this)">刪除</button>`;
  showToast('已儲存');
}

function deleteAnno(btn) {
  const card = btn.closest('.anno-card');
  card.style.opacity = '0';
  card.style.transform = 'translateX(20px)';
  card.style.transition = 'all .2s';
  setTimeout(() => {
    card.remove();
    annoCount = Math.max(0, annoCount - 1);
    document.querySelector('.anno-section-title').textContent = `標注記錄（${annoCount}）`;
  }, 200);
}

// ── Fake playback ───────────────────────────────────────
let playing = false, progress = 0.35, raf;
const playBtn  = document.getElementById('play-btn');
const seekFill = document.getElementById('seek-fill');
const seekThumb= document.getElementById('seek-thumb');
const timeDisp = document.getElementById('time-display');

function fmtT(ratio) {
  const s = ratio * 8;
  return '0:0' + s.toFixed(1);
}

function updateSeek(r) {
  progress = Math.max(0, Math.min(1, r));
  seekFill.style.width  = (progress*100) + '%';
  seekThumb.style.left  = (progress*100) + '%';
  timeDisp.textContent  = fmtT(progress) + ' / 0:08';
}

function tick() {
  if (!playing) return;
  progress += 0.002;
  if (progress >= 1) { progress = 0; playing = false; playBtn.textContent = '▶'; return; }
  updateSeek(progress);
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸' : '▶';
  if (playing) tick();
});

document.getElementById('seek-track').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  updateSeek((e.clientX - r.left) / r.width);
});

// ── Toast ───────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
