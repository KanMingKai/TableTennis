<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>桌球練習室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --nav-h: 64px;
    --accent:  #ff4500;
    --accent2: #ff6a2f;
    --bg:      #0a0a0a;
    --panel:   #111111;
    --border:  #1e1e1e;
    --border2: #2a2a2a;
    --dim:     #444444;
    --dim2:    #666666;
    --text:    #e0e0e0;
    --card-r: 6px;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans TC', system-ui, sans-serif;
    font-weight: 300;
    overflow: hidden; height: 100vh; height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Pages ── */
  .page {
    position: fixed; top: 0; left: 0; right: 0;
    bottom: var(--nav-h);
    display: none; overflow: hidden;
  }
  .page.active { display: block; }

  /* ── Bottom Nav ── */
  #bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--nav-h);
    background: rgba(10,10,10,.96);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 8px; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    backdrop-filter: blur(10px);
  }
  .nav-tab {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    flex: 1; background: none; border: none; color: var(--dim);
    font-size: 8px; font-weight: 400; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: color .2s; padding-top: 2px;
    -webkit-tap-highlight-color: transparent; position: relative;
  }
  .nav-tab svg {
    width: 22px; height: 22px; stroke: var(--dim); fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    transition: stroke .2s;
  }
  .nav-tab.active { color: var(--accent); }
  .nav-tab.active svg { stroke: var(--accent); }

  #btn-camera {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px var(--bg), 0 0 20px rgba(255,69,0,.45);
    position: relative; top: -10px; flex-shrink: 0;
    transition: transform .15s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent;
  }
  #btn-camera svg {
    width: 22px; height: 22px; stroke: #fff; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  #btn-camera:active { transform: scale(0.92) translateY(-4px); box-shadow: 0 0 0 3px var(--bg), 0 4px 24px rgba(255,69,0,.6); }

  /* ── Camera bottom-sheet ── */
  #camera-modal {
    position: fixed; inset: 0; z-index: 200;
    display: none; align-items: flex-end;
  }
  #camera-modal.show { display: flex; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); }
  .modal-sheet {
    position: relative; z-index: 1; width: 100%;
    background: var(--panel); border-radius: 12px 12px 0 0;
    border-top: 1px solid var(--border2);
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  .modal-handle { width: 36px; height: 3px; border-radius: 2px; background: var(--border2); margin: 0 auto 12px; }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 3px; text-align: center; margin-bottom: 4px; color: #fff; }
  .modal-btn {
    display: flex; align-items: center; gap: 16px;
    padding: 16px; border-radius: 4px;
    border: 1px solid var(--border2); background: transparent;
    color: var(--text); font-size: 14px; font-weight: 400;
    cursor: pointer; text-decoration: none;
    transition: border-color .2s; -webkit-tap-highlight-color: transparent;
  }
  .modal-btn:active, .modal-btn:hover { border-color: var(--accent); }
  .modal-btn .mb-icon { font-size: 24px; flex-shrink: 0; }
  .modal-btn .mb-desc { font-size: 11px; color: var(--dim2); font-weight: 300; margin-top: 2px; letter-spacing: .5px; }
  .modal-cancel { padding: 13px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--dim); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .modal-cancel:active { border-color: var(--border2); }

  /* ════════════════════════════════════
     HOME PAGE — Cinematic Dark Grid
  ════════════════════════════════════ */
  #page-home { background: #000; overflow-y: auto; scrollbar-width: none; }
  #page-home::-webkit-scrollbar { display: none; }

  /* Top bar */
  .home-topbar {
    position: sticky; top: 0; z-index: 10;
    height: 52px; padding: 0 16px;
    display: flex; align-items: center; gap: 10px;
    background: rgba(10,10,10,.96);
    border-bottom: 1px solid var(--border);
  }
  .home-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 5px; color: #fff; flex: 1;
  }
  .home-logo span { color: var(--accent); }
  .topbar-btn {
    width: 34px; height: 34px; border-radius: 6px;
    border: 1px solid var(--border2); background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; transition: border-color .2s;
  }
  .topbar-btn svg { width: 16px; height: 16px; stroke: var(--dim2); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .topbar-btn:active { border-color: var(--accent); }

  /* Pill tabs */
  .pill-row {
    display: flex; gap: 8px; padding: 10px 12px 8px;
    overflow-x: auto; scrollbar-width: none;
  }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill {
    padding: 6px 14px; border-radius: 3px; font-size: 9px; font-weight: 400;
    letter-spacing: 1.5px; text-transform: uppercase;
    border: 1px solid var(--border2); background: transparent; color: var(--dim);
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; transition: all .2s;
  }
  .pill.active { background: none; color: var(--accent); border-color: var(--accent); }

  /* Masonry */
  .masonry { columns: 2; column-gap: 10px; padding: 4px 10px 24px; }

  /* Card */
  .vid-card {
    break-inside: avoid; margin-bottom: 8px;
    border-radius: var(--card-r); overflow: hidden;
    position: relative; cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--border);
    -webkit-tap-highlight-color: transparent;
    transition: transform .14s;
  }
  .vid-card:active { transform: scale(0.965); }

  /* Thumbnail (video element as poster) */
  .card-thumb {
    width: 100%; display: block; position: relative; overflow: hidden;
  }
  .card-thumb video {
    width: 100%; height: 100%; display: block; object-fit: cover;
  }
  /* Alternating heights */
  .vid-card:nth-child(4n+1) .card-thumb { aspect-ratio: 9/16; }
  .vid-card:nth-child(4n+2) .card-thumb { aspect-ratio: 9/13; }
  .vid-card:nth-child(4n+3) .card-thumb { aspect-ratio: 9/14; }
  .vid-card:nth-child(4n+4) .card-thumb { aspect-ratio: 9/12; }

  /* Gradient overlay */
  .card-thumb::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.08) 45%, transparent 100%);
  }

  /* Duration badge */
  .card-dur {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    background: rgba(0,0,0,.65); backdrop-filter: blur(6px);
    border-radius: 6px; padding: 3px 7px;
    font-size: 10px; font-weight: 600; color: #fff; letter-spacing: .02em;
  }

  /* Play ring (shows on tap) */
  .card-play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 2; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .vid-card:active .card-play { opacity: 1; }
  .card-play svg { width: 13px; height: 15px; fill: #fff; margin-left: 2px; }

  /* Info inside card */
  .card-info {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
    padding: 8px 10px 10px;
  }
  .card-title {
    font-size: 12px; font-weight: 600; line-height: 1.35; color: #fff;
    margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-foot { display: flex; align-items: center; gap: 6px; }
  .card-av {
    width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .card-author { font-size: 10px; color: rgba(255,255,255,.5); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-likes { font-size: 10px; color: rgba(255,255,255,.45); display: flex; align-items: center; gap: 2px; }

  /* Loading / empty */
  .home-loading, .home-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: #374151; font-size: 14px; text-align: center;
    padding: 80px 32px;
  }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ════════════════════════════════════
     FULLSCREEN VIDEO PLAYER
  ════════════════════════════════════ */
  #vid-player {
    position: fixed; inset: 0; z-index: 150;
    background: #000; display: none; flex-direction: column;
  }
  #vid-player.show { display: flex; }

  /* Video area */
  .vp-video-wrap {
    flex: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #vp-video {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }

  /* Danmaku overlay */
  .vp-dm-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 110px;
    pointer-events: none; overflow: hidden;
  }
  .dm-item {
    position: absolute; left: 100%;
    white-space: nowrap; font-size: 18px; font-weight: 600;
    text-shadow: 1px 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.7);
    line-height: 1.2; pointer-events: none;
  }

  /* Top bar inside player */
  .vp-topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: 14px 14px 0;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
    pointer-events: none;
  }
  .vp-topbar > * { pointer-events: auto; }
  .vp-back {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,0,0,.5); backdrop-filter: blur(6px);
    border: none; color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .vp-title { flex: 1; font-size: 14px; font-weight: 600; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Side actions */
  .vp-actions {
    position: absolute; right: 12px; bottom: 120px; z-index: 5;
    display: flex; flex-direction: column; gap: 12px; align-items: center;
  }
  .vp-btn {
    width: 46px; height: 46px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    color: #fff; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; transition: background .12s, transform .12s;
  }
  .vp-btn:active { background: rgba(255,255,255,.2); transform: scale(0.92); }
  .vp-btn.liked { background: rgba(239,68,68,.5); }
  .vp-like-count { font-size: 11px; color: rgba(255,255,255,.8); line-height: 1; }

  /* Danmaku input bar */
  .vp-dm-bar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    display: flex; gap: 8px; align-items: center;
    padding: 8px 12px 16px;
    background: linear-gradient(to top, rgba(0,0,0,.7), transparent);
  }
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    .vp-dm-bar { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }
  .vp-dm-input {
    flex: 1; padding: 9px 14px; border-radius: 22px;
    border: 1px solid rgba(255,255,255,.22); background: rgba(0,0,0,.45);
    color: #fff; font-size: 14px; outline: none;
    backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .vp-dm-input::placeholder { color: rgba(255,255,255,.38); }
  .vp-dm-input:focus { border-color: rgba(255,69,0,.6); }
  .vp-dm-send {
    padding: 9px 16px; border-radius: 4px;
    border: 1px solid rgba(255,69,0,.5); background: rgba(255,69,0,.18);
    color: var(--accent); font-size: 12px; letter-spacing: 1px; cursor: pointer; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; text-transform: uppercase;
  }
  .vp-dm-send:active { background: rgba(255,69,0,.35); }

  /* ════════════════════════════════════
     MINE TAB
  ════════════════════════════════════ */
  #page-mine { background: #0a0a0f; overflow-y: auto; }
  .mine-header {
    padding: 20px 16px 14px; font-size: 18px; font-weight: 700;
    border-bottom: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: space-between;
  }
  .mine-refresh { font-size: 12px; color: #64748b; background: none; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
  .mine-thumb { position: relative; aspect-ratio: 9/16; background: #111827; overflow: hidden; cursor: pointer; }
  .mine-thumb video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .mine-thumb-del {
    position: absolute; top: 4px; right: 4px;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,0,0,.7); border: none; color: #fff; font-size: 11px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .mine-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 80px 32px; color: #475569; font-size: 14px; text-align: center; }
  .mine-empty .e-icon { font-size: 52px; }

  /* Mine fullscreen player */
  #mine-modal { position: fixed; inset: 0; z-index: 300; background: #000; display: none; align-items: center; justify-content: center; }
  #mine-modal.show { display: flex; }
  #mine-modal-video { max-width: 100%; max-height: 100dvh; object-fit: contain; }
  #mine-modal-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
</style>
</head>

     HOME: Cinematic grid
════════════════════════════════ -->

  <div class="home-topbar">
    <span class="home-logo">揮<span>拍</span>練習</span>

<!-- TEACH tab navigates directly, no iframe needed -->

<script>
'use strict';

// ── Device ID ──────────────────────────────────────────────
function getDeviceId() {
  let id = localStorage.getItem('tt_device_id');
  if (!id) {
    id = 'dev_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    localStorage.setItem('tt_device_id', id);
  }
  return id;
}
const DEVICE_ID = getDeviceId();
const DEL_PASSWORD = '0000';

// ── Tab navigation ─────────────────────────────────────────
let currentTab  = 'home';
const tabs = document.querySelectorAll('.nav-tab[data-tab]');

function switchTab(name) {
  if (name === 'teach') {
    window.location.href = 'tabletennis-forehand.html';
    return;
  }
  if (currentTab === name) return;
  currentTab = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  if (name === 'mine') loadMyVideos();
}
tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

// ── Hash-based tab (e.g. from forehand page's 我的 link) ───
if (location.hash === '#mine') {
  history.replaceState(null, '', location.pathname);
  switchTab('mine');
}

// ── Camera modal ───────────────────────────────────────────
const cameraModal = document.getElementById('camera-modal');
document.getElementById('btn-camera').addEventListener('click', () => cameraModal.classList.add('show'));
document.getElementById('modal-backdrop').addEventListener('click', () => cameraModal.classList.remove('show'));
document.getElementById('modal-cancel').addEventListener('click', () => cameraModal.classList.remove('show'));

// ── Pill tabs (client-side filter) ─────────────────────────
let allCardData = [];
let activeCat   = '';

document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    activeCat = p.dataset.cat;
    renderCards(activeCat);
  });
});

// ── Danmaku engine ─────────────────────────────────────────
const LANES   = 10;
const laneEnd = new Array(LANES).fill(0);
const dmCache = new Map();
const dmShown = new Map();

function getFreeLane() {
  const now = performance.now();
  let i = laneEnd.findIndex(t => t <= now);
  if (i === -1) i = Math.floor(Math.random() * LANES);
  return i;
}

function flyText(overlay, text, color) {
  const span = document.createElement('span');
  span.className   = 'dm-item';
  span.textContent = text;
  span.style.color = color || '#fff';
  overlay.appendChild(span);
  const lane  = getFreeLane();
  const laneH = overlay.offsetHeight / LANES;
  span.style.top = (lane * laneH + (laneH - 22) / 2) + 'px';
  const W   = overlay.offsetWidth;
  const dur = 7000 + Math.random() * 2000;
  laneEnd[lane] = performance.now() + dur;
  const t0 = performance.now();
  (function tick(now) {
    const p = (now - t0) / dur;
    if (p >= 1) { span.remove(); return; }
    span.style.transform = 'translateX(' + (-(W + span.offsetWidth) * p) + 'px)';
    requestAnimationFrame(tick);
  })(performance.now());
}

async function loadDanmaku(videoId) {
  if (dmCache.has(videoId)) return dmCache.get(videoId);
  try {
    const snap = await db.collection('danmaku').doc(videoId)
      .collection('comments').orderBy('time').get();
    const list = snap.docs.map(d => d.data());
    dmCache.set(videoId, list);
    return list;
  } catch(_) { dmCache.set(videoId, []); return []; }
}

// ── Load all videos from Firebase ─────────────────────────
(async () => {
  const content = document.getElementById('home-content');
  try {
    const snap = await db.collection('videos')
      .orderBy('uploadedAt', 'desc').limit(60).get();

    document.getElementById('home-loading').remove();

    if (snap.empty) {
      content.innerHTML = '<div class="home-empty"><div style="font-size:48px">🏓</div><div>還沒有影片<br>點下方 📷 上傳第一支吧！</div></div>';
      return;
    }

    allCardData = snap.docs.map(doc => ({ doc, data: doc.data() }));
    const masonry = document.createElement('div');
    masonry.className = 'masonry';
    masonry.id = 'masonry';
    content.appendChild(masonry);
    renderCards('');

  } catch(e) {
    content.innerHTML = '<div class="home-empty" style="color:#f87171;">載入失敗：' + escHtml(e.message) + '</div>';
  }
})();

function renderCards(cat) {
  const masonry = document.getElementById('masonry');
  if (!masonry) return;
  masonry.innerHTML = '';
  const filtered = cat
    ? allCardData.filter(({ data: d }) => (d.title || '').includes(cat))
    : allCardData;

  if (filtered.length === 0) {
    masonry.innerHTML = '<div class="home-empty" style="column-span:all"><div style="font-size:36px">🔍</div><div>沒有「' + escHtml(cat) + '」的影片</div></div>';
    return;
  }
  filtered.forEach(({ doc, data: d }) => masonry.appendChild(makeCard(doc, d)));
}

// ── Build one grid card ────────────────────────────────────
function makeCard(doc, d) {
  const docId = doc.id;
  const date  = d.uploadedAt ? new Date(d.uploadedAt.toDate()).toLocaleDateString('zh-TW') : '';
  const storageKey = 'liked_' + docId;
  let likeCount = d.likes || 0;

  const card = document.createElement('div');
  card.className = 'vid-card';
  card.dataset.docid = docId;

  // Thumbnail: video element, show first frame
  const thumbWrap = document.createElement('div');
  thumbWrap.className = 'card-thumb';

  const vid = document.createElement('video');
  vid.src = d.url.replace('/upload/', '/upload/f_auto/');
  vid.muted = true; vid.preload = 'metadata';
  vid.setAttribute('playsinline', '');
  vid.addEventListener('loadedmetadata', () => { vid.currentTime = 0.1; });
  thumbWrap.appendChild(vid);

  // Duration badge (shown after metadata)
  const durBadge = document.createElement('div');
  durBadge.className = 'card-dur';
  durBadge.textContent = '…';
  vid.addEventListener('loadedmetadata', () => {
    const s = vid.duration;
    if (isFinite(s)) durBadge.textContent = Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  });
  thumbWrap.appendChild(durBadge);

  // Play ring
  const playRing = document.createElement('div');
  playRing.className = 'card-play';
  playRing.innerHTML = '<svg viewBox="0 0 10 12"><path d="M0 0 L10 6 L0 12Z"/></svg>';
  thumbWrap.appendChild(playRing);

  // Info overlay
  const info = document.createElement('div');
  info.className = 'card-info';
  const likeStr = likeCount > 0 ? likeCount : '';
  info.innerHTML =
    '<div class="card-title">' + escHtml(d.title || '揮拍練習') + '</div>' +
    '<div class="card-foot">' +
      '<div class="card-av">' + escHtml((d.title || '揮')[0]) + '</div>' +
      '<span class="card-author">' + (date || '—') + '</span>' +
      '<span class="card-likes">♥ ' + (likeStr || 0) + '</span>' +
    '</div>';
  thumbWrap.appendChild(info);

  card.appendChild(thumbWrap);
  card.addEventListener('click', () => openVideoPlayer(docId, d, likeCount));
  return card;
}

// ── Fullscreen video player ────────────────────────────────
let vpDocId     = null;
let vpLikeCount = 0;
let vpMuted     = true;

const vpPlayer   = document.getElementById('vid-player');
const vpVideo    = document.getElementById('vp-video');
const vpOverlay  = document.getElementById('vp-dm-overlay');
const vpLikeBtn  = document.getElementById('vp-like-btn');
const vpLikeCnt  = document.getElementById('vp-like-count');
const vpMuteBtn  = document.getElementById('vp-mute-btn');
const vpDelBtn   = document.getElementById('vp-del-btn');
const vpDmInput  = document.getElementById('vp-dm-input');
const vpDmSend   = document.getElementById('vp-dm-send');

function openVideoPlayer(docId, d, likes) {
  vpDocId     = docId;
  vpLikeCount = likes || 0;

  document.getElementById('vp-title').textContent = d.title || '揮拍練習';
  vpVideo.src = d.url.replace('/upload/', '/upload/f_auto/');
  vpVideo.muted = vpMuted;
  vpVideo.currentTime = 0;
  vpVideo.play().catch(() => { vpVideo.muted = true; vpMuted = true; syncVpMute(); vpVideo.play().catch(() => {}); });

  // Like state
  const storageKey = 'liked_' + docId;
  const isLiked = !!localStorage.getItem(storageKey);
  vpLikeBtn.textContent = isLiked ? '❤️' : '🤍';
  vpLikeBtn.classList.toggle('liked', isLiked);
  vpLikeCnt.textContent = vpLikeCount;

  // Load & start danmaku
  vpOverlay.innerHTML = '';
  dmShown.set(docId, new Set());
  loadDanmaku(docId);

  vpPlayer.classList.add('show');
  document.getElementById('bottom-nav').style.display = 'none';
}

function closeVideoPlayer() {
  vpVideo.pause();
  vpVideo.src = '';
  vpOverlay.innerHTML = '';
  vpPlayer.classList.remove('show');
  document.getElementById('bottom-nav').style.display = '';
}

document.getElementById('vp-back').addEventListener('click', closeVideoPlayer);

// Like
vpLikeBtn.addEventListener('click', async () => {
  if (!vpDocId) return;
  const storageKey = 'liked_' + vpDocId;
  const wasLiked = !!localStorage.getItem(storageKey);
  if (wasLiked) {
    localStorage.removeItem(storageKey); vpLikeCount = Math.max(0, vpLikeCount - 1);
    vpLikeBtn.textContent = '🤍'; vpLikeBtn.classList.remove('liked');
  } else {
    localStorage.setItem(storageKey, '1'); vpLikeCount++;
    vpLikeBtn.textContent = '❤️'; vpLikeBtn.classList.add('liked');
  }
  vpLikeCnt.textContent = vpLikeCount;
  try { await db.collection('videos').doc(vpDocId).update({ likes: firebase.firestore.FieldValue.increment(wasLiked ? -1 : 1) }); } catch(_) {}
  // Update card in grid
  const card = document.querySelector('.vid-card[data-docid="' + vpDocId + '"] .card-likes');
  if (card) card.textContent = '♥ ' + vpLikeCount;
});

// Mute
vpMuteBtn.addEventListener('click', () => { vpMuted = !vpMuted; syncVpMute(); });
function syncVpMute() { vpVideo.muted = vpMuted; vpMuteBtn.textContent = vpMuted ? '🔇' : '🔊'; }

// Delete
vpDelBtn.addEventListener('click', async () => {
  const pwd = prompt('請輸入刪除密碼：');
  if (pwd === null) return;
  if (pwd !== DEL_PASSWORD) { alert('密碼錯誤'); return; }
  if (!confirm('確定刪除？（無法復原）')) return;
  try {
    await db.collection('videos').doc(vpDocId).delete();
    // Remove from allCardData and re-render
    allCardData = allCardData.filter(({ doc }) => doc.id !== vpDocId);
    closeVideoPlayer();
    renderCards(activeCat);
  } catch(err) { alert('刪除失敗：' + err.message); }
});

// Danmaku: timeupdate
vpVideo.addEventListener('timeupdate', () => {
  const list = dmCache.get(vpDocId); if (!list) return;
  const shown = dmShown.get(vpDocId) || new Set();
  const t = vpVideo.currentTime;
  list.forEach((dm, i) => {
    if (!shown.has(i) && dm.time <= t && t - dm.time < 0.5) {
      shown.add(i); flyText(vpOverlay, dm.text, dm.color);
    }
  });
});
vpVideo.addEventListener('seeked', () => dmShown.set(vpDocId, new Set()));

// Danmaku: send
async function sendVpDm() {
  const text = vpDmInput.value.trim();
  if (!text || !vpDocId) return;
  const time = vpVideo.currentTime; const color = '#ffffff';
  try {
    await db.collection('danmaku').doc(vpDocId).collection('comments').add({
      text, color, time, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    vpDmInput.value = '';
    flyText(vpOverlay, text, color);
    const list = dmCache.get(vpDocId) || [];
    list.push({ text, color, time }); list.sort((a, b) => a.time - b.time);
    dmCache.set(vpDocId, list);
  } catch(_) {}
}
vpDmSend.addEventListener('click', sendVpDm);
vpDmInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendVpDm(); });

// ── My Videos ──────────────────────────────────────────────
async function loadMyVideos() {
  const content = document.getElementById('mine-content');
  content.innerHTML = '<div class="mine-empty"><div class="spinner"></div><div>載入中…</div></div>';
  try {
    const snap = await db.collection('videos').where('deviceId', '==', DEVICE_ID).get();
    const docs = snap.docs.sort((a, b) => {
      const ta = a.data().uploadedAt?.toDate?.() || 0;
      const tb = b.data().uploadedAt?.toDate?.() || 0;
      return tb - ta;
    });
    if (docs.length === 0) {
      content.innerHTML = '<div class="mine-empty"><div class="e-icon">🎬</div><div>還沒有影片<br>點下方 📷 開始錄製吧！</div></div>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'mine-grid';
    docs.forEach(doc => grid.appendChild(makeMineThumb(doc)));
    content.innerHTML = '';
    content.appendChild(grid);
  } catch(e) {
    content.innerHTML = '<div class="mine-empty" style="color:#f87171;">載入失敗：' + escHtml(e.message) + '</div>';
  }
}

function makeMineThumb(doc) {
  const d = doc.data();
  const wrap = document.createElement('div');
  wrap.className = 'mine-thumb';
  const vid = document.createElement('video');
  vid.src = d.url.replace('/upload/', '/upload/f_auto/');
  vid.preload = 'metadata'; vid.muted = true;
  vid.setAttribute('playsinline', '');
  vid.addEventListener('loadedmetadata', () => { vid.currentTime = 0.1; });
  wrap.appendChild(vid);
  const delBtn = document.createElement('button');
  delBtn.className = 'mine-thumb-del'; delBtn.textContent = '✕';
  delBtn.addEventListener('click', async e => {
    e.stopPropagation();
    if (!confirm('刪除這支影片？')) return;
    try {
      await db.collection('videos').doc(doc.id).delete();
      wrap.remove();
      if (!document.querySelector('.mine-thumb'))
        document.getElementById('mine-content').innerHTML = '<div class="mine-empty"><div class="e-icon">🎬</div><div>還沒有影片</div></div>';
    } catch(err) { alert('刪除失敗：' + err.message); }
  });
  wrap.appendChild(delBtn);
  wrap.addEventListener('click', () => {
    document.getElementById('mine-modal-video').src = d.url.replace('/upload/', '/upload/f_auto/');
    document.getElementById('mine-modal').classList.add('show');
  });
  return wrap;
}

document.getElementById('mine-modal-close').addEventListener('click', () => {
  document.getElementById('mine-modal').classList.remove('show');
  const mv = document.getElementById('mine-modal-video');
  mv.pause(); mv.src = '';
});
document.getElementById('mine-refresh-btn').addEventListener('click', loadMyVideos);

// ── Helpers ────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
