<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>乒乓球揮拍</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #e2e8f0; font-family: "Noto Sans TC", system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; padding: 0 16px; height: 50px; border-bottom: 1px solid rgba(0,245,255,.12); background: rgba(0,0,0,.75); backdrop-filter: blur(8px); }
  .nav-logo { font-size: 15px; font-weight: 700; color: #00f5ff; letter-spacing: .04em; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; gap: 20px; }

  .hero { text-align: center; margin-bottom: 8px; }
  .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: .04em; }
  .hero p  { font-size: 14px; color: #64748b; margin-top: 6px; }

  .cards { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 380px; }

  .entry-card {
    display: flex; align-items: center; gap: 18px;
    background: #111827;
    border: 1px solid rgba(0,245,255,.12);
    border-radius: 16px;
    padding: 22px 20px;
    text-decoration: none; color: inherit;
    cursor: pointer;
    transition: transform .15s, border-color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .entry-card:active { transform: scale(0.97); }
  @media (hover: hover) {
    .entry-card:hover { transform: translateY(-3px); border-color: rgba(0,245,255,.4); background: #151f30; }
  }
  .entry-card.accent { border-color: rgba(0,245,255,.3); }

  .card-icon { font-size: 38px; flex-shrink: 0; }
  .card-text h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .card-text p  { font-size: 13px; color: #64748b; line-height: 1.5; }
  .card-arrow { margin-left: auto; color: #475569; flex-shrink: 0; }
  .card-arrow svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<header>
  <span class="nav-logo">🏓 揮拍練習</span>
</header>

<main>
  <div class="hero">
    <h1>乒乓球揮拍訓練</h1>
    <p>AI 姿勢偵測 · 社群交流</p>
  </div>

  <div class="cards">
    <a class="entry-card accent" href="tabletennis-forehand.html">
      <div class="card-icon">🎯</div>
      <div class="card-text">
        <h2>開始練習</h2>
        <p>AI 姿勢偵測，即時分析正手揮拍動作</p>
      </div>
      <div class="card-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
    </a>

    <a class="entry-card" href="platform/index.html">
      <div class="card-icon">🎬</div>
      <div class="card-text">
        <h2>瀏覽社群</h2>
        <p>觀看其他人的揮拍影片，留下彈幕互動</p>
      </div>
      <div class="card-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
    </a>
  </div>
</main>
</body>
</html>
