<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>乒乓球揮拍社群</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #e2e8f0; font-family: "Noto Sans TC", system-ui, sans-serif; min-height: 100vh; }

  header { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 50px; border-bottom: 1px solid rgba(0,245,255,.12); background: rgba(0,0,0,.75); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; }
  .nav-logo { font-size: 15px; font-weight: 700; color: #00f5ff; text-decoration: none; flex: 1; letter-spacing: .04em; }
  .nav-links { display: flex; gap: 4px; }
  .nav-link { font-size: 12px; color: #94a3b8; text-decoration: none; padding: 5px 10px; border-radius: 6px; transition: all .15s; white-space: nowrap; }
  .nav-link:hover { color: #e2e8f0; background: rgba(255,255,255,.07); }
  .nav-link.active { color: #10b981; background: rgba(16,185,129,.1); }
  .nav-link.practice { color: #00f5ff; border: 1px solid rgba(0,245,255,.3); }
  .nav-link.practice:hover { background: rgba(0,245,255,.1); }

  main { max-width: 700px; margin: 0 auto; padding: 20px 14px 40px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

  /* ── 影片卡片 ── */
  .card-wrap { position: relative; }
  .card {
    background: #111827;
    border: 1px solid rgba(0,245,255,.1);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, border-color .15s;
    text-decoration: none;
    color: inherit;
    display: block;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { transform: scale(0.98); }
  @media (hover: hover) {
    .card:hover { transform: translateY(-3px); border-color: rgba(0,245,255,.35); }
  }
  .card-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
  .card-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.3); }
  .play-overlay svg { width: 40px; height: 40px; fill: rgba(255,255,255,.85); }
  .card-body { padding: 11px 13px 13px; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 11px; color: #64748b; }

  /* ── 刪除按鈕 ── */
  .del-btn {
    position: absolute;
    top: 8px; right: 8px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,.7);
    color: #f87171;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    opacity: 0;
    transition: opacity .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .card-wrap:hover .del-btn,
  .card-wrap:focus-within .del-btn { opacity: 1; }
  /* 手機：永遠顯示刪除按鈕 */
  @media (hover: none) { .del-btn { opacity: 1; } }
  .del-btn:hover { background: rgba(239,68,68,.25); }

  .empty { text-align: center; color: #475569; padding: 60px 0; font-size: 15px; }
  .loading { text-align: center; color: #475569; padding: 60px 0; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(0,245,255,.15); border-top-color: #00f5ff; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <a class="nav-logo" href="index.html">🏓 乒乓球揮拍</a>
  <nav class="nav-links">
    <a class="nav-link active" href="index.html">社群</a>
    <a class="nav-link practice" href="tabletennis-forehand.html">開始練習</a>
  </nav>
</header>

<main>
  <div id="status" class="loading"><div class="spinner"></div>載入中…</div>
  <div class="grid" id="grid"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="platform/firebase-config.js"></script>
<script>
(async () => {
  const statusEl = document.getElementById('status');
  const grid     = document.getElementById('grid');

  try {
    const snap = await db.collection('videos')
      .orderBy('uploadedAt', 'desc')
      .limit(60)
      .get();

    statusEl.style.display = 'none';

    if (snap.empty) {
      grid.innerHTML = '<p class="empty">還沒有影片，快去練習並發布第一支揮拍吧！</p>';
      return;
    }

    snap.forEach(doc => addCard(doc));

  } catch(e) {
    statusEl.innerHTML = '<p class="empty">載入失敗：' + e.message + '</p>';
  }
})();

function addCard(doc) {
  const d    = doc.data();
  const grid = document.getElementById('grid');
  const date = d.uploadedAt
    ? new Date(d.uploadedAt.toDate()).toLocaleDateString('zh-TW')
    : '—';

  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';

  const a = document.createElement('a');
  a.className = 'card';
  a.href = 'platform/video.html?id=' + doc.id;
  a.innerHTML = `
    <div class="card-thumb">
      <video src="${d.url}" preload="metadata" muted playsinline></video>
      <div class="play-overlay">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
    <div class="card-body">
      <div class="card-title">${escHtml(d.title)}</div>
      <div class="card-meta">${date}</div>
    </div>`;

  const delBtn = document.createElement('button');
  delBtn.className = 'del-btn';
  delBtn.title = '刪除影片';
  delBtn.innerHTML = '🗑';
  delBtn.addEventListener('click', async e => {
    e.preventDefault();
    e.stopPropagation();
    if (!confirm('確定刪除「' + d.title + '」？\n（此操作無法復原）')) return;
    try {
      await db.collection('videos').doc(doc.id).delete();
      wrap.remove();
      if (!document.getElementById('grid').children.length) {
        document.getElementById('grid').innerHTML = '<p class="empty">還沒有影片，快去練習並發布第一支揮拍吧！</p>';
      }
    } catch(err) {
      alert('刪除失敗：' + err.message + '\n請先到 Firebase Console 更新規則，允許 delete。');
    }
  });

  wrap.appendChild(a);
  wrap.appendChild(delBtn);
  grid.appendChild(wrap);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
